name: One-time Library tagline update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-library-tagline:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace Library tagline
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text()
          old = 'Full articles and useful fragments, kept together and easy to find.'
          new = 'A working archive of sixgun knowledge.'
          if old not in text:
              raise SystemExit('Old tagline not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Change Library tagline"
          git push
